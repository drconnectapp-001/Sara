events {
    worker_connections 1024;
}

http {
    upstream frontend {
        server frontend:3000;
    }

    upstream api {
        server api:8000;
    }

    # Rate limiting for AI endpoints
    limit_req_zone $binary_remote_addr zone=ai_limit:10m rate=20r/m;

    server {
        listen 80;
        server_name _;

        # API routes
        location /api/ {
            limit_req zone=ai_limit burst=10 nodelay;
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # SSE support (streaming chat responses)
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
            chunked_transfer_encoding on;
        }

        # Frontend
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
        }

        # Let's Encrypt challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
    }

    # HTTPS server (uncomment after certbot runs on KVM2)
    # server {
    #     listen 443 ssl;
    #     server_name sara.yourdomain.com;
    #     ssl_certificate /etc/letsencrypt/live/sara.yourdomain.com/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/sara.yourdomain.com/privkey.pem;
    #     ... (same location blocks as above)
    # }
}
